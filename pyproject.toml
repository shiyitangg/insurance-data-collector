[project]
name = "insurance-data-collector"
version = "0.1.0"
description = "Collect and validate public insurance data from OpenFEMA"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
